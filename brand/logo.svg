<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Pulsar</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%"><stop offset="0" stop-color="#16264a"/><stop offset=".6" stop-color="#080f1e"/><stop offset="1" stop-color="#03060d"/></radialGradient>
    <linearGradient id="beamA" x1="256" y1="256" x2="470" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fd4ff" stop-opacity=".95"/><stop offset=".55" stop-color="#7cc4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="beamB" x1="256" y1="256" x2="42" y2="470" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fd4ff" stop-opacity=".95"/><stop offset=".55" stop-color="#7cc4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#d9eeff" stop-opacity=".9"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <g fill="#e9eef8"><circle cx="96" cy="112" r="3"/><circle cx="150" cy="70" r="2"/><circle cx="420" cy="330" r="2.5"/><circle cx="360" cy="440" r="2"/><circle cx="70" cy="300" r="2"/><circle cx="300" cy="80" r="1.6"/></g>
    <!-- the twin radio beams of a spinning neutron star -->
    <path d="M256 256 L430 26 L486 82 Z" fill="url(#beamA)"/>
    <path d="M256 256 L82 486 L26 430 Z" fill="url(#beamB)"/>
  </g>
  <!-- orbit, with the crew as the signal dot -->
  <ellipse cx="256" cy="256" rx="182" ry="60" transform="rotate(-24 256 256)" fill="none" stroke="#7cc4ff" stroke-opacity=".6" stroke-width="9"/>
  <circle cx="256" cy="256" r="70" fill="url(#core)" opacity=".7"/>
  <!-- heartbeat trace through the star -->
  <path d="M62 272 H172 L202 216 L240 336 L272 148 L304 300 L324 272 H450" fill="none" stroke="#f4f7fc" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="410" cy="170" r="19" fill="#ff7a3d"/>
</svg>
